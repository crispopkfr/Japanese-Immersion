<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Immersion - Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #18181b;
        color: #f4f4f5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background-color: #27272a;
        border: 1px solid #3f3f46;
        border-radius: 0.75rem;
        padding: 2.5rem 2rem;
        max-width: 28rem;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        color: #818cf8;
        background-color: rgba(99, 102, 241, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 1.75rem;
        height: 1.75rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #ffffff;
      }
      p {
        font-size: 0.875rem;
        color: #a1a1aa;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background-color: rgba(239, 68, 68, 0.1);
        color: #f87171;
        font-size: 0.75rem;
        font-weight: 500;
        margin-bottom: 1.25rem;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .badge-dot {
        width: 0.375rem;
        height: 0.375rem;
        border-radius: 50%;
        background-color: #ef4444;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      button {
        background-color: #4f46e5;
        color: #ffffff;
        border: none;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      button:hover {
        background-color: #4338ca;
      }
      .secondary-btn {
        background-color: transparent;
        color: #d4d4d8;
        border: 1px solid #3f3f46;
      }
      .secondary-btn:hover {
        background-color: #3f3f46;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a9 9 0 010-12.728M5.636 5.636l12.728 12.728M12 12a1 1 0 100-2 1 1 0 000 2z" />
        </svg>
      </div>
      <div class="badge">
        <span class="badge-dot"></span>
        <span>You are currently offline</span>
      </div>
      <h1>Offline Mode</h1>
      <p>This content requires an active network connection. Previously loaded manga chapters, video cards, and saved entries are stored locally and accessible when you return home.</p>
      <div class="actions">
        <button onclick="window.location.reload()">Retry Connection</button>
        <button class="secondary-btn" onclick="window.location.href='/'">Return to Main App</button>
      </div>
    </div>
  </body>
</html>
